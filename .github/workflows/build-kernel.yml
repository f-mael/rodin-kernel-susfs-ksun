name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "Kernel source repository URL"
        required: true
        default: "https://android.googlesource.com/kernel/common"
        type: string
      kernel_branch:
        description: "Kernel source branch or tag"
        required: true
        default: "android15-6.6"
        type: string
      defconfig:
        description: "Kernel defconfig"
        required: true
        default: "gki_defconfig"
        type: string
      anykernel_repo:
        description: "AnyKernel3 repository URL"
        required: false
        default: "https://github.com/KernelSU-Next/AnyKernel3"
        type: string
      anykernel_branch:
        description: "AnyKernel3 branch"
        required: false
        default: "master"
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout build scaffold
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git curl wget unzip rsync zip \
            build-essential bc bison flex \
            libssl-dev libelf-dev dwarves \
            ccache python3 python3-pip \
            clang lld llvm

      - name: Prepare scripts
        run: ./scripts/fix_permissions.sh

      - name: Fetch kernel source safely
        env:
          KERNEL_REPO: ${{ inputs.kernel_repo }}
          KERNEL_BRANCH: ${{ inputs.kernel_branch }}
        run: |
          if [[ ! "$KERNEL_REPO" =~ ^https:// ]]; then
            echo "[-] kernel_repo must start with https://"
            exit 1
          fi
          if [[ "$KERNEL_BRANCH" =~ [[:space:]] || "$KERNEL_BRANCH" == -* ]]; then
            echo "[-] kernel_branch cannot contain whitespace or start with '-'"
            exit 1
          fi
          git ls-remote --exit-code "$KERNEL_REPO" "$KERNEL_BRANCH" >/dev/null 2>&1 || \
            git ls-remote --exit-code "$KERNEL_REPO" "refs/tags/$KERNEL_BRANCH" >/dev/null 2>&1 || {
              echo "[-] Branch/tag '$KERNEL_BRANCH' not found in $KERNEL_REPO"
              exit 1
            }
          rm -rf kernel_source
          git clone --depth 1 \
            --branch "$KERNEL_BRANCH" \
            -- "$KERNEL_REPO" \
            kernel_source

      - name: Integrate KernelSU-Next and SUSFS
        run: ./scripts/apply_patches.sh

      - name: Build kernel
        env:
          DEFCONFIG: ${{ inputs.defconfig }}
          KBUILD_BUILD_USER: github-actions
          KBUILD_BUILD_HOST: ubuntu-latest
        run: ./scripts/build_kernel.sh

      - name: Fetch AnyKernel3
        if: ${{ inputs.anykernel_repo != '' }}
        env:
          ANYKERNEL_REPO: ${{ inputs.anykernel_repo }}
          ANYKERNEL_BRANCH: ${{ inputs.anykernel_branch }}
        run: |
          if [[ ! "$ANYKERNEL_REPO" =~ ^https:// ]]; then
            echo "[-] anykernel_repo must start with https://"
            exit 1
          fi
          if [[ "$ANYKERNEL_BRANCH" =~ [[:space:]] || "$ANYKERNEL_BRANCH" == -* ]]; then
            echo "[-] anykernel_branch cannot contain whitespace or start with '-'"
            exit 1
          fi
          git ls-remote --exit-code "$ANYKERNEL_REPO" "$ANYKERNEL_BRANCH" >/dev/null 2>&1 || \
            git ls-remote --exit-code "$ANYKERNEL_REPO" "refs/tags/$ANYKERNEL_BRANCH" >/dev/null 2>&1 || {
              echo "[-] Branch/tag '$ANYKERNEL_BRANCH' not found in $ANYKERNEL_REPO"
              exit 1
            }
          rm -rf AnyKernel3
          git clone --depth 1 \
            --branch "$ANYKERNEL_BRANCH" \
            -- "$ANYKERNEL_REPO" \
            AnyKernel3

      - name: Package AnyKernel3 zip
        if: ${{ inputs.anykernel_repo != '' }}
        run: ./scripts/package_anykernel3.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-artifacts-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
